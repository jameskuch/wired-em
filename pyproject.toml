[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbfsem-pytools"
version = "2.19.8"
description = "Python port of SBFSEM-tools: serial block-face EM connectomics analysis and rendering"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
authors = [{ name = "Sara Patterson" }, { name = "James A. Kuchenbecker" }]
maintainers = [{ name = "Neitz Lab" }]
keywords = ["connectomics", "electron-microscopy", "retina", "viking", "odata"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "networkx>=3.2",
  # shapely.maximum_inscribed_circle (analysis.thickness) is new in 2.1.
  "shapely>=2.1",
  "trimesh>=4.0",
  "scikit-image>=0.22",
  "httpx>=0.27",
  "pydantic>=2.6",
  "lxml>=5.0",
  "matplotlib>=3.8",
  "mapbox-earcut>=1.0",
  # trimesh delegates simplify_quadric_decimation to this; without it the
  # Decimate control silently returns the full mesh.
  "fast-simplification>=0.1.7",
  # Wireframe exports offer HDF5 alongside the text and numpy formats.
  "h5py>=3.10",
  # The linked-neurons report downloads as the .xlsx the lab's MATLAB script
  # wrote; pandas needs this engine to write one.
  "openpyxl>=3.1",
  # Viking's section corrections are served over gRPC (sbfsem.io.corrections
  # encodes the few messages itself, so no protobuf runtime is needed).
  "grpcio>=1.60",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  # Sign-in through the Viking Identity Server: Authlib drives the OpenID
  # Connect handshake (state, nonce, PKCE, id_token), itsdangerous signs the
  # cookie it keeps them in.  Both are inert unless SBFSEM_VIKING_AUTH is set.
  "authlib>=1.3",
  "itsdangerous>=2.1",
]
# MeshLab remeshing after any render (isotropic, quadric decimation, screened
# Poisson).  GPL-3 and ~300 MB installed, so optional, never imported by this
# package, and run in a child process (sbfsem.geometry.meshlab).
meshlab = ["pymeshlab>=2023.12"]
# pytest-xdist runs the suite in parallel: `pytest -n 6` (redeploy.sh uses it when installed).
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-xdist>=3.6", "ruff>=0.4", "mypy>=1.9"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
sbfsem-web = "sbfsem_web.__main__:main"
sbfsem-users = "sbfsem_web.auth:main"
sbfsem-measure = "sbfsem.service.measure:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sbfsem = ["data/*.txt", "data/*.json", "data/*.xml"]
sbfsem_web = ["static/**/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
# 3.12+: numpy's stubs use PEP 695 `type` statements, which older
# target versions reject outright.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
