# nginx reverse proxy for SBFSEM-pytools, with TLS.
#
# GENERATED by deploy/render-nginx-tls.py -- edit nginx-sbfsem.conf instead.
#
# Installed by deploy/bootstrap.sh INSTEAD OF nginx-sbfsem.conf once a
# Let's Encrypt certificate exists for the domain.  Get one with:
#
#   sudo bash /srv/sbfsem/app/deploy/certbot-setup.sh sbfsem-tools.com you@example.com

upstream sbfsem_app {
    server 127.0.0.1:8765;
    keepalive 8;
}

# Port 80 does two jobs: serve ACME renewals, and send everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name sbfsem-tools.com www.sbfsem-tools.com _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # To the canonical name, not $host: a visitor arriving on the bare IP
    # would otherwise be sent to https://<ip>, where the certificate cannot
    # match and the browser shows a warning before anything loads.
    location / {
        return 301 https://sbfsem-tools.com$request_uri;
    }
}

server {
    # `listen ... http2` rather than the newer `http2 on;` directive: Ubuntu
    # 24.04 ships nginx 1.24, where `http2 on` is an unknown directive and the
    # config will not load at all.  The old form works on both, warning only.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sbfsem-tools.com www.sbfsem-tools.com;

    ssl_certificate     /etc/letsencrypt/live/sbfsem-tools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sbfsem-tools.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/sbfsem-tools.com/chain.pem;

    # Mozilla "intermediate": TLS 1.2+ only, no legacy ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SbfsemTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No ssl_stapling: Let's Encrypt has stopped issuing certificates with an
    # OCSP responder URL, so it is a no-op that warns on every `nginx -t`.

    # Deliberately short to start with. A long max-age is hard to undo -- every
    # browser that has seen it refuses plain HTTP for that long, even if the
    # certificate lapses. Raise it to 31536000 once renewal has run cleanly.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # A neuron's mesh JSON is float text and runs to tens of megabytes; it
    # compresses roughly 3:1. Without this the browser waits on the wire.
    # application/x-sbfsem-mesh is a finished render as the page collects it
    # (sbfsem_web/mesh_binary.py), compressed in /api/mesh-jobs/ below.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain
               model/gltf+json model/vnd.collada+xml image/svg+xml
               application/x-sbfsem-mesh;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    # Neuron JSON uploads on /api/neurons/import.
    client_max_body_size 64m;

    access_log /var/log/nginx/sbfsem.access.log;
    error_log  /var/log/nginx/sbfsem.error.log;

    location / {
        proxy_pass http://sbfsem_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A first load of a large neuron with synapses, or a closed-curve volume
        # render, can take minutes. The default 60s read timeout cuts those off
        # mid-flight and the browser shows an unexplained 504.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Mesh responses are large and streamed; buffering them to disk first
        # only adds latency.
        proxy_buffering off;
    }

    # A finished render's poll: 7 to 17 MB a time.  Level 5 cost about 0.6 s
    # of CPU per c1178 surface here (~20 MB/s), longer than the link took to
    # carry it; level 1 compresses the page's binary to 2.99 MB, smaller than
    # the JSON at level 5 (3.43 MB), in a quarter of the time (2026-10-20).
    # The 64k read buffer: unbuffered, nginx passes on (and gzip flushes) each
    # read from the app, 4k by default, which made the binary 3.06 MB in
    # 0.22 s; read 64k at a time it is 2.99 MB in 0.15 s (1m: no better).
    # Otherwise the same as `location /`: a location inherits nothing from it.
    location /api/mesh-jobs/ {
        gzip_comp_level 1;
        proxy_buffer_size 64k;
        proxy_buffers 4 64k;
        proxy_pass http://sbfsem_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }

    # Vendored three.js and Cytoscape never change within a release, and the
    # app's own assets are already version-stamped in their URL.
    location /static/vendor/ {
        proxy_pass http://sbfsem_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        # The same forwarding headers as above, not nginx's default of passing
        # the client's own through: a request that sent "X-Forwarded-For:
        # 127.0.0.1" here reached the app looking like the server itself, and the
        # app skips the login for those (app.py, LOOPBACK_HOSTS).
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# The bare IP still answers on 443, but no certificate can be valid for it, so
# refuse rather than serving the site under a name it does not match.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/sbfsem-tools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sbfsem-tools.com/privkey.pem;
    return 301 https://sbfsem-tools.com$request_uri;
}
